name: Weekly App Groups

concurrency:
  group: rules-apps
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * 0   # 每周日 04:00（北京时间）

env:
  TZ: Asia/Shanghai

jobs:
  Crawl_App_Groups:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出仓库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install --quiet requests pypinyin

      - name: 恢复爬虫缓存
        uses: actions/cache@v4
        with:
          path: .cache/crawl
          key: app-crawl-${{ github.run_id }}
          restore-keys: app-crawl-

      - name: 爬取厂商子域（CT + 字典）
        run: timeout 2100 python3 -u scripts/crawl_rules.py || echo "爬虫超时，沿用缓存"

      - name: 生成 App 分组
        run: python3 -u scripts/gen_apps.py

      - name: DNS 校验（清死域，只删确认 NXDOMAIN 的）
        run: python3 -u scripts/validate.py || echo "校验失败，沿用旧 dead.txt"

      - name: 打包分组
        run: |
          cd rules && zip -q -r apps.zip apps && cd ..
          echo "分组文件数: $(ls rules/apps | wc -l)"

      - name: 发布分组到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: App 分组
          overwrite_files: true
          fail_on_unmatched_files: false
          files: rules/apps.zip

      - name: 提交分组到仓库
        run: |
          git config user.email "adqgg@users.noreply.github.com"
          git config user.name "adqgg"
          git add -f -A rules/apps
          git commit -q -m "App 分组更新 $(date -u '+%F %H:%M') UTC" || echo "无变化"
          for i in 1 2 3; do
            if git pull -q --no-rebase -X ours origin main && git push -q origin main; then echo "GitHub 已更新"; exit 0; fi
            echo "第 ${i} 次推送失败"; sleep 5
          done
          echo "::warning::GitHub 推送失败"

      - name: 同步到 Gitee
        timeout-minutes: 8
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then echo "未配置 Token，跳过"; exit 0; fi
          git config user.email "adqgg@users.noreply.github.com"
          git config user.name "adqgg"
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/ADS9/ad.git" 2>/dev/null || true
          export GIT_TERMINAL_PROMPT=0
          for i in 1 2 3; do
            if git fetch --depth=1 gitee m 2>/dev/null; then
              git rm -r --cached -q rules/apps 2>/dev/null || true
              git rm --cached -q -r rules 2>/dev/null || true
              git add -f rules/hosts.txt rules/whitelist.txt
              TREE=$(git write-tree)
              C=$(git commit-tree "$TREE" -p FETCH_HEAD -m "分组更新 $(date -u '+%F %H:%M') UTC")
              if timeout 240 git push gitee "$C:m"; then echo "Gitee 分组已同步"; exit 0; fi
            fi
            echo "第 ${i} 次失败"; sleep 5
          done
          echo "::warning::Gitee 分组同步失败"
