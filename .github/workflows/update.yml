name: Update Filters

on:
  schedule:
    - cron: '0 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-main
  cancel-in-progress: false

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 合并上游规则
        env:
          OUT_DIR: rules
          CACHE_DIR: .cache/src
          DNS_CHECK: "1"
        run: python3 adblock.py

      - name: 健康巡查
        run: |
          echo "===== 健康巡查 ====="
          N=$(grep -c '^0.0.0.0' rules/hosts.txt || echo 0)
          A=$(grep -c '^||' rules/adguard.txt || echo 0)
          D=$(grep -c . rules/domains.txt || echo 0)
          W=$(grep -c '^0.0.0.0' rules/whitelist.txt || echo 0)
          echo "hosts=$N adguard=$A domains=$D whitelist=$W"
          [ "$N" -ge 4000 ] || { echo "规则数异常偏低"; exit 1; }
          [ "$A" -eq "$N" ] || { echo "adguard 与 hosts 条数不一致"; exit 1; }
          [ "$D" -eq "$N" ] || { echo "domains 与 hosts 条数不一致"; exit 1; }
          [ "$W" -ge 300 ] || { echo "白名单过少"; exit 1; }
          grep -qE 'gitee\.com|github\.com' rules/hosts.txt && { echo "仓库域名被误拦"; exit 1; } || true
          for f in dnsmasq.conf clash.yaml surge.list whitelist_adguard.txt; do
            [ -s "rules/$f" ] || { echo "$f 为空"; exit 1; }
          done
          echo "巡查通过"

      - name: 提交产物
        run: |
          git config user.email "adqgg@local"
          git config user.name "adqgg"
          git add -f -A rules
          if git diff --cached --quiet; then echo "产物无变化，跳过提交"; exit 0; fi
          git commit -m "规则更新 $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do
            if git push; then echo "推送成功（第 $i 次）"; PUSHED=1; break; fi
            echo "推送失败，对齐远端后重试（第 $i 次）"
            git fetch -q --depth=1 origin main
            git reset -q --mixed FETCH_HEAD
            git add -f -A rules
            git commit -m "规则更新 $(date -u '+%F %H:%M') UTC" || true
            sleep 5
          done
          [ "$PUSHED" = "1" ] || { echo "三次推送均失败"; exit 1; }

      - name: 失败告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `规则更新失败 ${new Date().toISOString().slice(0,16)}`,
              body: `工作流 ${{ github.workflow }} 运行失败。\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            })
