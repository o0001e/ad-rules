name: Update Filters
concurrency:
  group: rules-main
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */8 * * *

env:
  TZ: Asia/Shanghai

jobs:
  Update_Filters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !rules/apps
          sparse-checkout-cone-mode: false

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 合并上游规则
        run: python3 adblock.py

      - name: 安全检查
        run: |
          N=$(grep -c '^0.0.0.0' rules/hosts.txt || echo 0)
          echo "规则数: $N"
          if [ "$N" -lt 1000 ]; then echo "::error::规则数异常偏低"; exit 1; fi
          if grep -qE 'gitee\.com|github\.com' rules/hosts.txt; then echo "::error::仓库域名被误拦"; exit 1; fi

      - name: 误报回归检测
        run: python3 scripts/regress.py

      - name: 发布产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rule
          name: 规则产物
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            rules/hosts.txt
            rules/adguard.txt
            rules/domains.txt
            rules/all.txt
            rules/whitelist.txt

      - name: 根目录兼容副本
        run: |
          cp rules/hosts.txt hosts.txt
          cp rules/all.txt all.txt
          cp rules/adguard.txt adguard.txt

      - name: 推送到 GitHub 主分支
        run: |
          git config user.email "adqgg@users.noreply.github.com"
          git config user.name "adqgg"
          git add -f rules/hosts.txt rules/whitelist.txt rules/whitelist_adguard.txt             rules/all.txt rules/adguard.txt rules/domains.txt rules/dnsmasq.conf             rules/clash.yaml rules/surge.list rules/build_report.txt             rules/source_report.txt rules/source_score.txt rules/regress_report.txt             hosts.txt all.txt adguard.txt
          git commit -q -m "规则更新 $(date -u '+%F %H:%M') UTC" || true
          git push origin HEAD:main || true

      - name: Gitee 可用性体检
        run: python3 scripts/gitee_check.py || true

      - name: 同步到 Gitee
        timeout-minutes: 8
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then echo "未配置 Token，跳过"; exit 0; fi
          git config user.email "adqgg@users.noreply.github.com"
          git config user.name "adqgg"
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/ADS9/ad.git"
          export GIT_TERMINAL_PROMPT=0
          for i in 1 2 3; do
            if git fetch --depth=1 gitee m 2>/dev/null; then
              git rm -r --cached -q rules/apps 2>/dev/null || true
              git rm --cached -q -r rules 2>/dev/null || true
              git add -f rules/hosts.txt rules/whitelist.txt
              PARENT=$(git rev-parse FETCH_HEAD)
              TREE=$(git write-tree)
              C=$(git commit-tree "$TREE" -p "$PARENT" -m "同步自 GitHub 构建 $(date -u '+%F %H:%M') UTC")
              if timeout 240 git push gitee "$C:m"; then echo "Gitee 同步成功"; exit 0; fi
            fi
            echo "第 ${i} 次失败"; sleep 5
          done
          echo "::warning::Gitee 同步失败"

      - name: 打版本快照标签
        if: success()
        run: |
          TAG="v$(date -u '+%Y%m%d-%H%M')"
          git tag -f "$TAG"
          git push -f origin "$TAG" || true
          git tag | sort | head -n -30 | xargs -r -n1 git push --delete origin || true
          git tag | sort | head -n -30 | xargs -r git tag -d || true

  Notify_Failure:
    needs: [ Update_Filters ]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 开 Issue 告警
        uses: actions/github-script@v7
        with:
          script: |
            const title = `构建失败 ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = `工作流 [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 失败，请检查日志。`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

  Delete_Workflow_Runs:
    needs: [ Update_Filters ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 6
