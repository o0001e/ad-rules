main:
  push:
    - name: 规则合并
      docker:
        image: python:3.11
      stages:
        - name: 合并并产出
          script: |
            python3 -m pip install --quiet requests
            python3 adblock.py
        - name: 提交产物
          script: |
            git config user.email "adqgg@noreply.cnb.cool"
            git config user.name "adqgg"
            date -u '+%F %H:%M UTC' > rules/cnb_last.txt
            grep -c '^0.0.0.0' rules/hosts.txt >> rules/cnb_last.txt
            cp rules/hosts.txt hosts.txt
            cp rules/all.txt all.txt
            cp rules/adguard.txt adguard.txt
            git add -f rules hosts.txt all.txt adguard.txt
            git commit -m "规则更新 $(date -u '+%F %H:%M') UTC" || echo "无变化"
            git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" HEAD:main

  "crontab: 0 */8 * * *":
    - name: 定时规则合并
      docker:
        image: python:3.11
      stages:
        - name: 合并并产出
          script: |
            python3 -m pip install --quiet requests
            python3 adblock.py
        - name: 提交产物
          script: |
            git config user.email "adqgg@noreply.cnb.cool"
            git config user.name "adqgg"
            date -u '+%F %H:%M UTC' > rules/cnb_last.txt
            grep -c '^0.0.0.0' rules/hosts.txt >> rules/cnb_last.txt
            cp rules/hosts.txt hosts.txt
            cp rules/all.txt all.txt
            cp rules/adguard.txt adguard.txt
            git add -f rules hosts.txt all.txt adguard.txt
            git commit -m "定时更新 $(date -u '+%F %H:%M') UTC" || echo "无变化"
            git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" HEAD:main
